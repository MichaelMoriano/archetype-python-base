[project]
name = "institutional-python-cli"
version = "0.1.1"
description = "Generate validated Python services from pinned institutional archetypes"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cookiecutter>=2.6,<3",
    "httpx>=0.28.1,<0.29",
]

[project.scripts]
create-python-project = "institutional_archetype_cli.cli:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "institutional_archetype_cli"

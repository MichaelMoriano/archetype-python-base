[project]
name = "archetype-python-base"
version = "0.1.0"
description = "Arquetipo base empresarial para microservicios Python especializados en IA"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "httpx>=0.28.1,<0.29",
    "pydantic-settings>=2.14.2,<3",
    "uvicorn[standard]>=0.52.1,<0.53",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "python_ai_service"

[dependency-groups]
dev = [
    "cookiecutter>=2.6,<3",
    "cvss>=3.6,<4",
    "httpx2>=2.12.0,<3",
    "mypy>=2.3.0,<3",
    "packaging>=26.2",
    "pip-audit>=2.10.1",
    "pysonar>=1.9.0.5762",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.16.1,<0.17",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.mypy]
plugins = ["pydantic.mypy"]

python_version = "3.13"
strict = true
pretty = true
show_error_codes = true
show_error_context = true
warn_unused_configs = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
files = ["src", "scripts", "tests", "tools/archetype_cli/src"]
mypy_path = "tools/archetype_cli/src"

[[tool.mypy.overrides]]
module = ["cvss", "cvss.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
    "unit: pruebas unitarias sin dependencias externas",
    "integration: pruebas con infraestructura o composición completa",
    "contract: pruebas de contratos/adaptadores",
    "evaluation: pruebas de calidad IA",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/python_ai_service"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
